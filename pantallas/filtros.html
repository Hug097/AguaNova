<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1b2b">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aqua">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aqua · Filtros</title>
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../style/style.css">
<link rel="stylesheet" href="../style/pantallas.css">
</head>
<body data-base="../" data-pagina="filtros">
<div class="app dos">

  <header class="top">
    <div class="izq"><a class="atras" href="../index.html" aria-label="Volver al inicio"><span data-ico="atras"></span></a><h1>Filtros</h1></div>
    <div class="acciones"><span class="pill-sim">Simulado</span><button class="btn-ico" data-instalar hidden aria-label="Instalar app"><span data-ico="descargar"></span></button></div>
  </header>

  <a class="alerta" id="alerta" href="#pasos">
    <span data-ico="alerta"></span>
    <div><b>Es hora de limpiar los filtros</b><span id="alertaT"></span></div>
  </a>

  <section class="card grande mitad">
    <div class="anillo" id="anillo"></div>
    <img class="sticker flota" id="mascota" src="../assets/stickers/gotita-feliz.svg" alt="" width="64" height="64">
    <h2 id="titulo">--</h2>
    <p class="nota" id="texto">--</p>
  </section>

  <section class="card mitad" id="pasos">
    <div class="card-h"><h2>Cómo limpiarlos</h2><span class="label" id="progPasos">0/5</span></div>
    <ul class="pasos" id="listaPasos"></ul>
    <div style="margin-top:14px">
      <button class="btn primary" id="btnLimpie"><span data-ico="check"></span>Ya limpié los filtros</button>
    </div>
    <p class="nota" style="margin-top:10px">Al confirmar, el contador de ciclos vuelve a 0.</p>
  </section>

  <section class="card">
    <div class="card-h"><h2>Limpiezas anteriores</h2></div>
    <ul class="linea" id="limpiezas"></ul>
  </section>

  <footer id="ultima">Prototipo con datos simulados</footer>
</div>

<script src="../js/datos.js"></script>
<script src="../js/comun.js"></script>
<script src="../js/filtros.js"></script>
<script src="../js/pwa.js"></script>
</body>
</html>
